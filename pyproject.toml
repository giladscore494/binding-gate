[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "binding-gate"
dynamic = ["version"]
description = "A deterministic verification gate against entity-attribution failures (deceptive grounding) in LLM agents that answer from retrieved sources."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
# Later PRs append ONE line each here for their own optional extras
# (see ARCHITECTURE.md, "Shared files"). The core package has no runtime dependencies.
dev = ["pytest>=8"]
plots = ["matplotlib>=3.7"]
faithfulness = ["minicheck @ git+https://github.com/Liyan06/MiniCheck.git@b58b9fa69acbd1015ec970fa65dd752413a053d2", "torch>=2.5", "transformers>=4.46,<5", "accelerate>=1.0", "nltk>=3.9", "huggingface_hub>=0.26"]  # PR 5: faithfulness_checker arm (MiniCheck, pinned commit)
mcp = ["mcp>=2.3,<3"]  # PR 9: MCP server (binding_gate.mcp.server); official MCP Python SDK, v2 low-level Server API
sealqa = ["pyarrow>=16"]  # PR 8: converts SealQA's pinned parquet files to JSON Lines (cli dataset-prepare); not needed to run

[tool.setuptools.dynamic]
version = { attr = "binding_gate.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
