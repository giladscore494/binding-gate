# PR 8 / PR 13 dev run of layer 3 (live web, SealQA; configs/budget.toml, run "dev_live"): every dev
# question, ONE repeat, the primary model(s) openai-low, google-low, arms no_gate (live) and gated_research.
# Dev split only. The workflow runs this config as ONE job over every model whose API key is set, so
# that all models share the same searches and pages and one search quota.
#
# Arms (PREREGISTRATION.md section 5; protocol in src/binding_gate/arms/gated_research.py):
#   no_gate         component "no_gate_live": the harness searches the question (Serper, Google),
#                   fetches the top results until 5 pages were fetched, shows their stored text
#                   (first 8,000 characters each) and the model answers. No gate.
#   gated_research  the SAME first attempt (shared searches, pages and answer request), then
#                   decomposer + gate; on RESEARCH one targeted re-search and a second answer +
#                   gate. max_attempts = 2.
# Every search response, robots.txt and page is stored under runs/<run_id>/snapshots/; page text is
# third-party material: the workflow encrypts the run artifacts of this config.
#
# Search quota (PR 13; provider changed to Serper in PR 27, section 18 amendment 3): the study uses
# Serper's free tier (serper.dev, read 2026-11-22: 2,500 queries on signup, no card; credits only for
# successful queries), priced conservatively at $0.001 per search in configs/prices.toml (paid plans
# about $1 per 1,000; UNVERIFIED). [runner] max_searches caps the searches of one invocation (Serper
# has no account check, so nothing lowers it); a unit that could exceed it is not started, and the
# run is resumed with the same command. Allocation (section 3, layer 3, item 7): this smoke (at most
# 10) + dev_live (at most 240) + test_live (at most 250 per invocation) = at most 500 searches plus
# one preflight search per invocation, far under the 2,500 free queries. min_interval_seconds = 1
# (Serper documents no hourly limit like SerpApi's Free plan; was 72 s). Every unit (item x model)
# runs its first attempt and its re-search together, items in their fixed order, so a stop never
# cuts an item's re-search.
#
# Size: about 102-114 dev questions (the real count is known after `cli dataset-prepare`); at most
# 2 searches per question (first attempt + one re-search), shared by all models: at most about 228
# searches, under the 240 of max_searches.
#
# Models and sampling: as in configs/dev_baseline.toml (section 9, lowest reasoning setting).
# Nothing in this file is read from environment variables; only API keys are
# (src/binding_gate/secrets.py).

config_version = 1
name = "dev-live"
description = "PR 8/13: live-web dev run on SealQA (seal_hard), 1 repeat, 2 primary model(s), no_gate (live) and gated_research; Serper free tier."
split = "dev"
repeats = 1

[runner]
# Hard budget cap in US dollars PER MODEL LABEL (reported usage x configs/prices.toml; auxiliary
# calls such as the decomposer and the judge included). Each cap is this run's allotment in
# configs/budget.toml, just above its HIGH estimate; sum of caps 1.75 USD. PROPOSED. PR 27: searches are
# now priced ($0.001 each, Serper), and the dry run charges every model job all 108-216 searches, so
# HIGH rose from A 0.35 / E 0.85 to A 0.57 / E 1.07 and the caps from 0.40 / 0.90 to 0.60 / 1.15
# (HIGH x 1.05 rounded up to 0.05).
concurrency = 4
prices = "configs/prices.toml"
max_searches = 240                       # PROPOSED: unchanged from PR 13 (Serper free tier: 2,500 queries)
max_usd = 0.6
[runner.max_usd_by_model]
google-low = 1.15

[dataset]
name = "sealqa"
[dataset.options]
root = "data/raw/sealqa"                 # filled by `python -m binding_gate.cli dataset-prepare` (git-ignored)
revision = "0e75db526ad93dd039714897b7631afc03510e30"
subsets = ["seal_hard", "seal_0"]        # items = seal_hard; seal_0 only marks its questions
repository = "https://huggingface.co/datasets/vtllms/sealqa"

[[models]]                               # slot A
name = "openai_responses"
label = "openai-low"
[models.options]
model_id = "gpt-6-luna"
max_output_tokens = 4096
# temperature: not sent (provider default); see the header
reasoning = { effort = "none" }         # lowest setting (section 9); UNVERIFIED for this id, see the header
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot E
name = "google_gemini"
label = "google-low"
[models.options]
model_id = "gemini-3.1-flash-lite"
max_output_tokens = 4096
temperature = 0.0
thinking_config = { thinkingLevel = "minimal" }   # lowest setting (section 9); UNVERIFIED for this id
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[arms]]
name = "no_gate_live"                    # the live baseline: same first attempt, no gate
label = "no_gate"                        # the reference arm of the statistics (PREREGISTRATION.md section 8)
[arms.options]
presentation = "sealqa_live_web"
documents_per_attempt = 5                # PROPOSED
max_document_chars = 8000                # PROPOSED
[arms.options.search]
name = "serper_google"
label = "search"
[arms.options.search.options]
max_results = 10                         # PROPOSED: organic results kept per search
hl = "en"
gl = "us"
min_interval_seconds = 1.0               # PR 27: Serper documents no hourly limit (was 72 s, SerpApi Free plan)
timeout_seconds = 60
max_retries = 4
backoff_seconds = 5.0
max_backoff_seconds = 120.0
[arms.options.fetch]                     # PROPOSED limits (research/fetch.py)
max_bytes = 2000000
timeout_seconds = 20.0
max_redirects = 5
per_host_interval_seconds = 1.0

[[arms]]
name = "gated_research"
[arms.options]
presentation = "sealqa_live_web"
documents_per_attempt = 5                # PROPOSED; must equal no_gate's so the first attempt is shared
max_document_chars = 8000                # PROPOSED; idem
max_attempts = 2                         # PROPOSED: the first attempt plus ONE targeted re-search
checks = ["quote_verbatim", "entity_in_window", "qualifiers_in_window", "no_closer_competitor", "premise_present"]
[arms.options.parameters]                # PROPOSED (section 5.1), identical to configs/dev_gated.toml
window_tokens = 40
min_quote_tokens = 5
lead_max_tokens = 4
lead_min_repeats = 2
premise_scope = "document"
competitor_tie = "fail"
[arms.options.search]                    # must equal no_gate's so searches are shared
name = "serper_google"
label = "search"
[arms.options.search.options]
max_results = 10                         # PROPOSED: organic results kept per search
hl = "en"
gl = "us"
min_interval_seconds = 1.0               # PR 27: Serper documents no hourly limit (was 72 s, SerpApi Free plan)
timeout_seconds = 60
max_retries = 4
backoff_seconds = 5.0
max_backoff_seconds = 120.0
[arms.options.fetch]                     # PROPOSED limits (research/fetch.py)
max_bytes = 2000000
timeout_seconds = 20.0
max_redirects = 5
per_host_interval_seconds = 1.0
[arms.options.decomposer]
name = "model_decomposer"                # slot "Dec" (provisional), as in configs/dev_gated.toml
[arms.options.decomposer.options]
prompt_version = 1
[arms.options.decomposer.options.model]
name = "openai_responses"
label = "decomposer"
[arms.options.decomposer.options.model.options]
model_id = "gpt-6-luna"
max_output_tokens = 4096
reasoning = { effort = "none" }          # lowest setting, as for slot A (section 9)
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[scorers]]
name = "sealqa_answer"                   # deterministic correctness rule (PREREGISTRATION.md section 7, layer 3)
[scorers.options]
min_quote_tokens = 5
