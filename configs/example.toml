# Example run configuration (config_version 1).
#
# This file documents the format and is loaded by the test suite. It is an
# illustration, not a runnable config: its model client name is a stand-in. The
# runnable PR 2 configs are configs/dev_smoke.toml and configs/dev_baseline.toml
# (models from PREREGISTRATION.md section 9), which also show the optional
# [runner] table (concurrency, budget cap, price file).
#
# A run is selected by passing the path of a file like this one. Nothing here is
# ever read from environment variables.

config_version = 1
name = "example-dev-smoke"
description = "Format illustration only: ungated baseline on a few dev groups."
split = "dev"
repeats = 3
limit = 5            # dev only: use the first 5 groups (smoke run)

[dataset]
name = "deceptive_grounding"

[dataset.options]
root = "data/raw/deceptive-grounding-benchmark"

[[models]]
name = "client-defined-in-pr2"
label = "model-under-test-a"

[models.options]
model_id = "TODO-frozen-in-preregistration"
temperature = 0.0

[[arms]]
name = "no_gate"

[[scorers]]
name = "provenance"
