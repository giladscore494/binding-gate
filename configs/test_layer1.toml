# PR 6 / PR 13: the frozen layer-1 TEST run, CONFIRMATORY for H1-H3 (PREREGISTRATION.md sections 5, 8,
# 11 and 12; configs/budget.toml, run "test_layer1").
#
# Run ONLY through the one-command frozen test run, after the pre-registration is FROZEN and tagged:
#
#   python -m binding_gate.cli frozen-test-run --config configs/test_layer1.toml \
#       --tag prereg-freeze-1 --purpose "layer-1 confirmatory test run" --confirm-spend
#
# It refuses (and logs the refusal in audit/test_access_log.jsonl) unless HEAD is exactly the
# freeze tag, the working tree is clean and PREREGISTRATION.md says FROZEN. Then it runs every
# arm below on the test split and writes the analysis under runs/<run_id>/analysis/.
#
# PR 13/14 ($50 budget): the three PRIMARY low-cost models (A, E, H), every test item (2,505), ONE
# repeat. All gate arms (gated, the five ablations, faithfulness_checker) send the no_gate answer
# request, so within this run the runner answers it ONCE per item and model and every gate arm
# judges that same answer: the only paid calls are no_gate, prompt_entity_check (its own prompt)
# and the decomposer (at most one call per distinct test question per model job). A test run
# never uses seeds. llm_judge_checks is not in the test run (dev subsample only:
# configs/dev_llm_judge_checks.toml); the mid-tier models run on a test subsample in
# configs/test_layer1_midtier.toml.
#
# Every arm has the options of its dev counterpart (tests/test_pr12_test_config.py), so a frozen
# run executes what was run and calibrated on dev. Models, sampling, dataset pin and scorer are
# identical to configs/dev_baseline.toml (section 9). Caps: the test split cannot be dry-run, so
# the HIGH estimate is the dev dry run of these arms scaled by 2,505 / 1,455 items
# (configs/budget.toml). PROPOSED - requires owner approval before freeze.
# Nothing in this file is read from environment variables; only API keys are
# (src/binding_gate/secrets.py).

config_version = 1
name = "test-layer1"
description = "Frozen layer-1 test run: pre-registered arms, three primary low-cost models (A, E, H), 1 repeat, test split."
split = "test"
repeats = 1

[runner]
# Hard budget cap in US dollars PER MODEL LABEL (reported usage x configs/prices.toml; auxiliary
# calls such as the decomposer and the judge included). Each cap is this run's allotment in
# configs/budget.toml, just above its HIGH estimate; sum of caps 16.75 USD. PROPOSED.
concurrency = 8
prices = "configs/prices.toml"
max_usd = 2.6
[runner.max_usd_by_model]
google-low = 7.35
zai-low = 6.8

[dataset]
name = "deceptive_grounding"
[dataset.options]
root = "data/raw/deceptive-grounding-benchmark"
repository = "https://github.com/CedricCaruzzo/deceptive-grounding-benchmark"
commit = "61b0281d8d3897f53bef3f7402727c905614c1e4"
data_sha256 = "1feb80b85717ada1b48114b2dc1922ad5cfa694f4444888669ebc716f8653123"

[[models]]                               # slot A
name = "openai_responses"
label = "openai-low"
[models.options]
model_id = "gpt-6-luna"
max_output_tokens = 4096
# temperature: not sent (provider default); see the header
reasoning = { effort = "none" }         # lowest setting (section 9); UNVERIFIED for this id, see the header
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot E
name = "google_gemini"
label = "google-low"
[models.options]
model_id = "gemini-3.1-flash-lite"
max_output_tokens = 4096
temperature = 0.0
thinking_config = { thinkingLevel = "minimal" }   # lowest setting (section 9); UNVERIFIED for this id
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot H
name = "zai_chat"
label = "zai-low"
[models.options]
model_id = "glm-5.3-flash"
max_output_tokens = 4096
temperature = 0.0                        # documented range [0.0, 1.0] (docs.z.ai); UNVERIFIED live, see the header
thinking = { type = "enabled" }          # GLM-5.3 models cannot disable thinking (docs.z.ai, read 2026-11-22)
reasoning_effort = "low"                 # lowest setting for GLM-5.3 / GLM-5.3-Flash (section 9; docs.z.ai)
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

# ---- Arms (PREREGISTRATION.md section 5). Labels are what the analysis reads
# (binding_gate.stats.prereg): "no_gate" is the reference, "gated" is H1/H2,
# "faithfulness_checker" is H3. The ablations ("gated_minus_<check>") and prompt_entity_check are
# exploratory.

[[arms]]
name = "no_gate"
label = "no_gate"
[arms.options]
presentation = "deceptive_grounding_doc_injection"

[[arms]]
name = "prompt_entity_check"
label = "prompt_entity_check"
[arms.options]
presentation = "deceptive_grounding_doc_injection"

[[arms]]
name = "faithfulness_checker"            # MiniCheck-Flan-T5-Large, pinned (section 5); needs the
label = "faithfulness_checker"           # faithfulness extra and `faithfulness_checker prepare`
[arms.options]
presentation = "deceptive_grounding_doc_injection"
backend = "minicheck"
evidence = "all_documents"

[[arms]]
name = "gated"
label = "gated"
[arms.options]
presentation = "deceptive_grounding_doc_injection"
checks = ["quote_verbatim", "entity_in_window", "qualifiers_in_window", "no_closer_competitor", "premise_present"]
[arms.options.parameters]          # PROPOSED - requires owner approval before freeze
window_tokens = 40                 # tokens between quote and mention, at most
min_quote_tokens = 5               # same as the provenance scorer (section 6.3)
lead_max_tokens = 4                # longest lead term considered a document subject
lead_min_repeats = 2               # a lead term must recur in its document
premise_scope = "document"         # key terms looked up in the whole cited document
competitor_tie = "fail"            # equal distance of entity and competitor blocks
[arms.options.decomposer]
name = "model_decomposer"          # PR 3; slot "Dec" of PREREGISTRATION.md section 9 (provisional)
[arms.options.decomposer.options]
prompt_version = 1
[arms.options.decomposer.options.model]
name = "openai_responses"
label = "decomposer"
[arms.options.decomposer.options.model.options]
model_id = "gpt-6-luna"
max_output_tokens = 4096
reasoning = { effort = "none" }    # lowest setting, as for slot A (section 9)
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

