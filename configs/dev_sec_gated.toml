# sec_answer (PR 17): the stated amount against the XBRL gold value of the filing, the peer's figures and
# the other years (labels correct / value_unsupported / wrong_entity / wrong_period_or_scale / other_wrong /
# abstained / unparseable); the quote's provenance is recorded with the provenance logic.
[[scorers]]
name = "sec_answer"
[scorers.options]
min_quote_tokens = 5
