# The USD 50 budget plan of the whole study (PR 13, re-derived in PR 14; PREREGISTRATION.md
# section 9, "Budget plan").
#
# PR 14: only providers the owner funds are used - OpenAI (A, B, decomposer), Google (E, F), Z.ai
# (H glm-5.3-flash, I glm-5.3) and Moonshot (judge J). Anthropic (C, D) and DeepSeek (G) left the
# plan; their configs survive only under configs/extended/.
#
# The owner's TOTAL budget for every paid API and search call of the study - smoke runs, dev
# baseline, decomposer measurement, gated arm, ablations, comparison baselines, judges, layers 2
# and 3, and the frozen test runs - is USD 50, hard. This file lists every planned paid run with
# its LOW and HIGH estimate and its CAP (the sum of the hard per-model budget caps of its config,
# times the number of invocations). Rules, checked by tests/test_budget_plan.py:
#   - the planned HIGH total is at most planned_high_max_usd (45 USD), leaving a reserve of at least
#     reserve_usd (5 USD) under the hard limit for re-runs (calibration re-runs of dev_gated, a
#     repeated smoke run, a resumed run) and estimation error;
#   - the sum of all caps is at most hard_limit_usd (50 USD): even if every run spent its full cap,
#     the study could not exceed 50 USD;
#   - every run's cap equals what its config enforces, and is at least its HIGH estimate;
#   - every paid config under configs/ (run configs, the decomposer measurement, re-scoring
#     configs) is listed here; the full-scale design of PRs 1-12 is kept under configs/extended/
#     (marked EXTENDED, not run, "if funding becomes available").
#
# How the estimates were made (2026-11-22, nothing spent; re-run in PR 14): `python -m binding_gate.cli dry-run`
# on the pinned benchmark (dev split), with the token assumptions of configs/prices.toml: input =
# characters / 4; 250 visible output tokens per call; hidden reasoning 0 (low) to 500 (high) per
# call at the lowest reasoning setting of section 9, and 0 to 2,000 for the judge, which runs at
# its provider default; the GLM models (H, I), whose thinking cannot be switched off, 100 to 2,000
# at reasoning_effort "low" (their own values in configs/prices.toml). Seeded answers (`seed_responses_from = ["seeds/*"]`) cost nothing and are
# left out (the dry run subtracts them once the seed runs are downloaded). Test-split runs cannot
# be dry-run: the dev dry run of the same arms is scaled by 2,505 / 1,455 items (layer 1), or the
# same subsample definition is dry-run on dev (mid-tier: 15 items per condition on either split).
# Layer 3 was dry-run on a synthetic stand-in of SealQA's reported size (254 questions, 108 dev);
# searches cost 0 on SerpApi's Free plan. The runs with slots A and E only (decomposer, layer 3,
# layer 2, LLM-judge arm) are unchanged from PR 13; the secondary judge's estimate is 3/4 of PR
# 13's (three dev-baseline run directories instead of four, the same prompts per directory).
# Caps = HIGH x 1.05 rounded up to 0.05 USD per model, at least 0.10 USD per model.
#
# PR 17, layer 2 (SEC financial filings): the dataset is generated from EDGAR only in GitHub Actions, so the
# estimates are dry runs of the sec configs on a synthetic EDGAR stand-in with realistic statement sizes
# (tests/sec_fixture.py; 238 companies, 714 items, 300 dev; 8,400 prompt characters per item on average),
# made conservative in two ways for HIGH and the caps: (1) every document at its pre-registered size budget
# (10,000 characters; prompt input x 1.6 of the fixture average) and (2) the largest possible item count
# (all 300 selected companies usable: 900 items, 360 dev and 540 test at the expected 40/60 split). LOW
# uses the fixture's document sizes and 750 items (300 dev, 450 test). After the first generation, the real
# dev dry run (free) replaces these numbers before the freeze.
#
# Outer safety net: a monthly spending limit in every provider's dashboard (docs/RUNNING.md,
# "Provider spending limits").

budget_version = 1
hard_limit_usd = 50.0
planned_high_max_usd = 45.0
reserve_usd = 5.0

# PR 18 added two dev runs of the binding-scope candidates (dev_gated_scope, dev_sec_gated_scope; decomposer only,
# 0.00 / 0.21 / 0.60): totals low 14.25, HIGH 42.78, caps 48.35 USD. No other entry changed.
# Totals of the runs below before PR 18 (PR 17): low 14.25, HIGH 42.57, caps 47.75 USD (PR 14: 13.16 / 39.21 / 43.70;
# PR 13: 17.35 / 43.24 / 48.65). PR 17 removed the two GRAB-RAG runs (layer 2 until PR 17; 0.22 / 0.92 /
# 1.00; their configs moved to configs/extended/) and added the four runs of the new layer 2 (SEC financial
# filings; 1.31 / 4.28 / 5.05). No layer-1 entry and no exploratory entry changed.

