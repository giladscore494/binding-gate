# EXTENDED DESIGN - NOT PART OF THE USD 50 STUDY; NOT RUN (PR 13).
# This is the full-scale configuration as it stood before PR 13 (6 models, 3 repeats,
# every arm on every item, reasoning at the provider default), kept so that nothing is
# lost: run it only "if funding becomes available", after an amendment
# (PREREGISTRATION.md section 9, "Extended design"). It is priced with
# configs/extended/prices.toml (2,000 hidden reasoning tokens per call at the provider
# default). tests/test_budget_plan.py checks that every paid config outside
# configs/extended/ is in configs/budget.toml.
#
# PR 8 dev run of layer 3 (live web, SealQA): every dev question, 3 repeats, the six
# models under test (PREREGISTRATION.md section 9), arms no_gate (live) and gated_research.
# Dev split only. The workflow runs this config as ONE job over every model whose API key is
# set, so that all models share the same searches and pages and one search rate limit.
#
# Arms (PREREGISTRATION.md section 5; protocol in src/binding_gate/arms/gated_research.py):
#   no_gate         component "no_gate_live": the harness searches the question (SerpApi,
#                   Google), fetches the top results until 5 pages were fetched, shows their
#                   stored text (first 8,000 characters each) and the model answers. No gate.
#   gated_research  the SAME first attempt (shared searches, pages and answer request, so the
#                   runner's cache returns no_gate's candidate), then decomposer + gate; on
#                   RESEARCH one targeted re-search ("<entity>" <qualifiers> <attribute>) and a
#                   second answer + gate. max_attempts = 2.
# Every search response, robots.txt and page is stored under runs/<run_id>/snapshots/;
# the gate and the scorer only see documents built from the stored text. Page text is
# third-party material: the workflow encrypts the run artifacts of this config.
#
# Budget: [runner] max_usd caps EVERYTHING charged to a model's records: its answer calls,
# the decomposer, web searches (configs/prices.toml: serpapi/google $0.025 per search) and
# fetches ($0). Run `python -m binding_gate.cli dry-run --config <this file>` first.
#
# All numeric choices marked PROPOSED require owner approval before the freeze.
# Nothing in this file is read from environment variables; only API keys are
# (repository secrets for the model providers and for SerpApi, the web search).

config_version = 1
name = "extended-dev-live"
description = "PR 8: live-web dev run on SealQA (seal_hard), 3 repeats, 6 models, no_gate (live) and gated_research."
split = "dev"
repeats = 3

[runner]
concurrency = 8
prices = "configs/extended/prices.toml"
# Hard caps per model label (answer calls + every search, fetch and decomposition charged to
# that model's records). Each cap is just above the model's HIGH dry-run estimate, computed
# on a synthetic stand-in of SealQA's reported size (254 questions -> 114 dev questions;
# the real dev count is known only after `cli dataset-prepare`): openai-low 13.02,
# openai-mid 41.14, anthropic-low 13.02, anthropic-mid 41.14, google-low 15.62,
# google-mid 36.05 USD. That high estimate assumes 2,000 reasoning tokens per call, a
# re-search for EVERY item and repeat, and charges each model job the full search cost
# (in the single workflow job searches are shared, so they are paid once: 2.85-11.40 USD).
# Sum of caps: 14 + 42 + 14 + 42 + 16 + 37 = 165 USD. Lower them after the smoke run.
max_usd = 14.0
[runner.max_usd_by_model]
openai-mid = 42.0
anthropic-mid = 42.0
google-low = 16.0
google-mid = 37.0

[dataset]
name = "sealqa"
[dataset.options]
root = "data/raw/sealqa"                 # filled by `python -m binding_gate.cli dataset-prepare` (git-ignored)
revision = "0e75db526ad93dd039714897b7631afc03510e30"
subsets = ["seal_hard", "seal_0"]        # items = seal_hard; seal_0 only marks its questions
repository = "https://huggingface.co/datasets/vtllms/sealqa"

[[models]]                               # slot A
name = "openai_responses"
label = "openai-low"
[models.options]
model_id = "gpt-6-luna"
max_output_tokens = 4096
# temperature: not sent (provider default); see the header
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot B
name = "openai_responses"
label = "openai-mid"
[models.options]
model_id = "gpt-6.1-sol"
max_output_tokens = 4096
# temperature: not sent (provider default); see the header
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot C
name = "anthropic_messages"
label = "anthropic-low"
[models.options]
model_id = "claude-haiku-5-5"
max_output_tokens = 4096
temperature = 0.0
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot D
name = "anthropic_messages"
label = "anthropic-mid"
[models.options]
model_id = "claude-sonnet-5-5"
max_output_tokens = 4096
temperature = 0.0
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot E
name = "google_gemini"
label = "google-low"
[models.options]
model_id = "gemini-3.1-flash-lite"
max_output_tokens = 4096
temperature = 0.0
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot F
name = "google_gemini"
label = "google-mid"
[models.options]
model_id = "gemini-3.5-flash"
max_output_tokens = 4096
temperature = 0.0
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[arms]]
name = "no_gate_live"                    # the live baseline: same first attempt, no gate
label = "no_gate"                        # the reference arm of the statistics (PREREGISTRATION.md section 8)
[arms.options]
presentation = "sealqa_live_web"
documents_per_attempt = 5                # PROPOSED
max_document_chars = 8000                # PROPOSED
[arms.options.search]
name = "serpapi_google"
label = "search"
[arms.options.search.options]
max_results = 10                         # PROPOSED: organic results kept per search
hl = "en"
gl = "us"
min_interval_seconds = 18.0              # 200 searches per hour = SerpApi Starter plan limit
timeout_seconds = 60
max_retries = 4
backoff_seconds = 5.0
max_backoff_seconds = 120.0
[arms.options.fetch]                     # PROPOSED limits (research/fetch.py)
max_bytes = 2000000
timeout_seconds = 20.0
max_redirects = 5
per_host_interval_seconds = 1.0

[[arms]]
name = "gated_research"
[arms.options]
presentation = "sealqa_live_web"
documents_per_attempt = 5                # PROPOSED; must equal no_gate's so the first attempt is shared
max_document_chars = 8000                # PROPOSED; idem
max_attempts = 2                         # PROPOSED: the first attempt plus ONE targeted re-search
checks = ["quote_verbatim", "entity_in_window", "qualifiers_in_window", "no_closer_competitor", "premise_present"]
[arms.options.parameters]                # PROPOSED (section 5.1), identical to configs/dev_gated.toml
window_tokens = 40
min_quote_tokens = 5
lead_max_tokens = 4
lead_min_repeats = 2
premise_scope = "document"
competitor_tie = "fail"
[arms.options.search]                    # must equal no_gate's so searches are shared
name = "serpapi_google"
label = "search"
[arms.options.search.options]
max_results = 10
hl = "en"
gl = "us"
min_interval_seconds = 18.0
timeout_seconds = 60
max_retries = 4
backoff_seconds = 5.0
max_backoff_seconds = 120.0
[arms.options.fetch]
max_bytes = 2000000
timeout_seconds = 20.0
max_redirects = 5
per_host_interval_seconds = 1.0
[arms.options.decomposer]
name = "model_decomposer"                # slot "Dec" (provisional), as in configs/dev_gated.toml
[arms.options.decomposer.options]
prompt_version = 1
[arms.options.decomposer.options.model]
name = "openai_responses"
label = "decomposer"
[arms.options.decomposer.options.model.options]
model_id = "gpt-6-luna"
max_output_tokens = 4096
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[scorers]]
name = "sealqa_answer"                   # deterministic correctness rule (PREREGISTRATION.md section 7, layer 3)
[scorers.options]
min_quote_tokens = 5
