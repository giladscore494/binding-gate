# Token prices used by the dry-run cost estimate and by the budget cap.
# US dollars per 1,000,000 tokens, standard (non-batch, non-cached) list prices.
# One entry per exact model id, each with its source and the date it was read.
# None of these prices was fetched from an official pricing page by this
# project's code; they were supplied with the model selection on 2026-11-22
# (PREREGISTRATION.md section 9) and are UNVERIFIED unless the note says otherwise.
# Check them against the provider invoices after the smoke run.
#
# PR 14: the USD 50 study uses only providers the owner funds (OpenAI, Google, Z.ai, Moonshot).
# The Anthropic (claude-haiku-5-5, claude-sonnet-5-5) and DeepSeek (deepseek-flash) prices left
# this file; they stay in configs/extended/prices.toml for the extended design.

prices_version = 1

[assumptions]
# Used only by the dry-run estimate; the budget cap uses the usage the provider reports.
chars_per_token = 4.0          # input tokens ~= prompt characters / 4 (rule of thumb for English, about +-20%)
visible_output_tokens = 250    # the JSON answer: a one/two-sentence value, a quote, a source id
reasoning_tokens_low = 0       # hidden reasoning/thinking tokens per call billed as output: none ...
reasoning_tokens_high = 500    # ... up to an average of 500 at the LOWEST reasoning setting (PR 13; an assumption)
# PR 13/14: every model under test runs at its lowest reasoning setting (PREREGISTRATION.md
# section 9: OpenAI reasoning effort "none", Gemini thinkingLevel "minimal", Z.ai GLM
# reasoning_effort "low" - GLM-5.3 models cannot switch thinking off, so they carry their own
# low and high assumptions below). At those settings the expected hidden
# reasoning is near zero; 500 tokens per call on average is a deliberately generous high
# assumption (before PR 13: 2,000 at the provider default; that value is kept in
# configs/extended/prices.toml for the extended design). The smoke run measures the real
# usage. A model that runs at its provider default (the judge, slot J) carries its own
# reasoning_tokens_high below; so do the GLM models (slots H and I, PR 14), whose thinking stays on
# at the lowest setting and which also carry their own reasoning_tokens_low.

[[price]]
model_id = "gpt-6-luna"
input_per_mtok = 0.10
output_per_mtok = 0.50
source = "The Register, 2026-10-26 (price); developers.openai.com model page (id)"
accessed = "2026-11-22"

[[price]]
model_id = "gpt-6.1-sol"
input_per_mtok = 2.00
output_per_mtok = 10.00
source = "The Register, 2026-10-26 (price)"
accessed = "2026-11-22"
note = "model id verified by the preflight 2026-11-22. Its lowest reasoning effort is 'low' ('none' is rejected with HTTP 400, smoke run 2026-11-22), hence its own reasoning assumptions"
reasoning_tokens_low = 100
reasoning_tokens_high = 2000

[[price]]
model_id = "gemini-3.1-flash-lite"
input_per_mtok = 0.25
output_per_mtok = 1.50
source = "ai.google.dev/gemini-api/docs/pricing"
accessed = "2026-11-22"

[[price]]
model_id = "gemini-3.5-flash"
input_per_mtok = 1.50
output_per_mtok = 9.00
source = "ai.google.dev/gemini-api/docs/pricing"
accessed = "2026-11-22"
note = "third-party sources mention newer 3.6-3.8 Flash ids not seen on the official page; the preflight must confirm this id exists"

[[price]]
model_id = "glm-5.3-flash"
input_per_mtok = 0.15
output_per_mtok = 0.50
source = "docs.z.ai/guides/overview/pricing (official; read 2026-11-22); id listed in docs.z.ai/api-reference/llm/chat-completion"
accessed = "2026-11-22"
note = "slot H (PR 14), primary. Cached input $0.03 (not modelled: the estimate assumes no cache hits); no off-peak price is stated for API billing. Thinking cannot be disabled (docs.z.ai): lowest setting reasoning_effort = low, hence its own low and high reasoning assumptions (UNVERIFIED; the smoke run measures them). Whether completion_tokens includes the thinking is not documented; the cap assumes it does"
reasoning_tokens_low = 100
reasoning_tokens_high = 2000

[[price]]
model_id = "glm-5.3"
input_per_mtok = 1.40
output_per_mtok = 4.40
source = "docs.z.ai/guides/overview/pricing (official; read 2026-11-22); id from docs.z.ai/guides/llm/glm-5.3 and the chat-completion API reference"
accessed = "2026-11-22"
note = "slot I (PR 14), exploratory mid-tier. Cached input $0.26 (not modelled). Thinking cannot be disabled; lowest setting reasoning_effort = low, hence its own reasoning assumptions (UNVERIFIED)"
reasoning_tokens_low = 100
reasoning_tokens_high = 2000

[[price]]
model_id = "kimi-k3.1-pro"
input_per_mtok = 2.00
output_per_mtok = 10.00
source = "tech-insider report (price); platform.kimi.ai model list (id)"
accessed = "2026-11-22"
note = "secondary judge (slot J); price unverified. Runs at its provider-default reasoning (no option is sent), hence its own high assumption"
reasoning_tokens_high = 2000

# PR 8 (layer 3): per-call prices (per_call_usd) for the web search API and the page fetcher.
# Every call in a trace is priced by the id in its response ("serper/google",
# "binding-gate/fetch@1") and charged to the budget cap of the record's model.
# PR 27: the study searches with Serper ("serper/google"); the SerpApi entry stays for the record.

[[price]]
model_id = "serper/google"
input_per_mtok = 0.0
output_per_mtok = 0.0
per_call_usd = 0.001
source = "serper.dev and third-party pricing summaries (read 2026-11-22): free tier 2,500 queries on signup (no card); paid plans about $1 per 1,000 queries - UNVERIFIED"
accessed = "2026-11-22"
note = "PR 27: conservative price per successful search (Serper deducts credits only for successful queries). The study expects to stay inside the 2,500 free queries (at most 500 study searches plus one preflight search per invocation), so the real cost is expected to be $0; the price makes the runner's caps cover even a paid plan. The preflight search is not charged"

[[price]]
model_id = "serpapi/google"
input_per_mtok = 0.0
output_per_mtok = 0.0
per_call_usd = 0.0
source = "serpapi.com/pricing (read 2026-11-22): Free plan, 250 searches per month, 50 per hour"
accessed = "2026-11-22"
note = "PR 13: the USD 50 study uses SerpApi's Free plan, which costs nothing and cannot overrun (searches beyond the quota are refused by SerpApi). The monthly quota is enforced by [runner] max_searches in the live-web configs. Before PR 13: $0.025 (Starter plan, $25 per 1,000), kept in configs/extended/prices.toml"

[[price]]
model_id = "binding-gate/fetch@1"
input_per_mtok = 0.0
output_per_mtok = 0.0
per_call_usd = 0.0
source = "no charge: direct HTTP GET by this project's page fetcher (research/fetch.py)"
