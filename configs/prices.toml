# Token prices used by the dry-run cost estimate and by the budget cap.
# US dollars per 1,000,000 tokens, standard (non-batch, non-cached) list prices.
# One entry per exact model id, each with its source and the date it was read.
# None of these prices was fetched from an official pricing page by this
# project's code; they were supplied with the model selection on 2026-11-22
# (PREREGISTRATION.md section 9) and are UNVERIFIED unless the note says otherwise.
# Check them against the provider invoices after the smoke run.

prices_version = 1

[assumptions]
# Used only by the dry-run estimate; the budget cap uses the usage the provider reports.
chars_per_token = 4.0          # input tokens ~= prompt characters / 4 (rule of thumb for English, about +-20%)
visible_output_tokens = 250    # the JSON answer: a one/two-sentence value, a quote, a source id
reasoning_tokens_low = 0       # hidden reasoning/thinking tokens per call billed as output: none ...
reasoning_tokens_high = 500    # ... up to an average of 500 at the LOWEST reasoning setting (PR 13; an assumption)
# PR 13: every model under test runs at its lowest reasoning setting (PREREGISTRATION.md
# section 9: OpenAI reasoning effort "none", Gemini thinkingLevel "minimal", Claude without
# extended thinking, DeepSeek non-thinking mode). At those settings the expected hidden
# reasoning is near zero; 500 tokens per call on average is a deliberately generous high
# assumption (before PR 13: 2,000 at the provider default; that value is kept in
# configs/extended/prices.toml for the extended design). The smoke run measures the real
# usage. A model that runs at its provider default (the judge, slot J) carries its own
# reasoning_tokens_high below.

[[price]]
model_id = "gpt-6-luna"
input_per_mtok = 0.10
output_per_mtok = 0.50
source = "The Register, 2026-10-26 (price); developers.openai.com model page (id)"
accessed = "2026-11-22"

[[price]]
model_id = "gpt-6.1-sol"
input_per_mtok = 2.00
output_per_mtok = 10.00
source = "The Register, 2026-10-26 (price)"
