# PR 4 dev run of the gated arm (PREREGISTRATION.md sections 5 and 5.1; configs/budget.toml, run
# "dev_gated"). Same dataset, models, sampling and scorer as configs/dev_baseline.toml; only the
# arms differ. Dev split only, 1 repeat.
#
# Arms:
#   no_gate  - the baseline, listed first.
#   gated    - the SAME candidate (identical answer request), then the decomposer (A), the five
#              deterministic checks (C, D) and the verdict (E). RESEARCH counts as an abstention
#              in this layer (no search).
# Ablations are pure config: configs/dev_ablation_*.toml (ARCHITECTURE.md section 3).
#
# Cost (PR 13): `seed_responses_from = ["seeds/*"]` reuses the dev baseline's answers (the
# workflow downloads the runs of the workflow run given in seed_run_id into seeds/), so the
# answer calls cost nothing; what is paid is the decomposer, at most once per distinct question
# per model job (45 dev questions), charged to the cap of the record's model. A paid run
# refuses if no seed run was downloaded. Re-runs of this config after a calibration of the gate
# parameters (python -m binding_gate.gates.calibration; no model calls) cost the same.
#
# Gate parameters below are PROPOSED values (section 5.1) and require owner approval before the
# freeze. The decomposer is slot "Dec" of section 9 (gpt-6-luna, lowest reasoning setting).
# Nothing in this file is read from environment variables; only API keys are
# (src/binding_gate/secrets.py).

config_version = 1
name = "dev-gated"
description = "PR 4/13: no_gate (seeded) and gated (all five checks) on the dev split, 1 repeat, primary models."
split = "dev"
repeats = 1

[runner]
# Hard budget cap in US dollars PER MODEL LABEL (reported usage x configs/prices.toml; auxiliary
# calls such as the decomposer and the judge included). Each cap is this run's allotment in
# configs/budget.toml, just above its HIGH estimate; sum of caps 0.4 USD. PROPOSED.
concurrency = 8
prices = "configs/prices.toml"
seed_responses_from = ["seeds/*"]      # PR 13: every run of the workflow run given in seed_run_id
max_usd = 0.1

[dataset]
name = "deceptive_grounding"
[dataset.options]
root = "data/raw/deceptive-grounding-benchmark"
repository = "https://github.com/CedricCaruzzo/deceptive-grounding-benchmark"
commit = "61b0281d8d3897f53bef3f7402727c905614c1e4"
data_sha256 = "1feb80b85717ada1b48114b2dc1922ad5cfa694f4444888669ebc716f8653123"

[[models]]                               # slot A
name = "openai_responses"
label = "openai-low"
[models.options]
model_id = "gpt-6-luna"
max_output_tokens = 4096
# temperature: not sent (provider default); see the header
reasoning = { effort = "none" }         # lowest setting (section 9); UNVERIFIED for this id, see the header
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot C
name = "anthropic_messages"
label = "anthropic-low"
[models.options]
model_id = "claude-haiku-5-5"
max_output_tokens = 4096
temperature = 0.0
# thinking: not sent = no extended thinking (the lowest setting; section 9)
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot E
name = "google_gemini"
label = "google-low"
[models.options]
model_id = "gemini-3.1-flash-lite"
max_output_tokens = 4096
temperature = 0.0
thinking_config = { thinkingLevel = "minimal" }   # lowest setting (section 9); UNVERIFIED for this id
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot G
name = "deepseek_chat"
label = "deepseek-low"
[models.options]
model_id = "deepseek-flash"
max_output_tokens = 4096
temperature = 0.0                        # UNVERIFIED on DeepSeek's API; see the header
thinking = { type = "disabled" }        # non-thinking mode (section 9); documented by DeepSeek, read 2026-11-22
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[arms]]
name = "no_gate"
label = "no_gate"
[arms.options]
presentation = "deceptive_grounding_doc_injection"

[[arms]]
name = "gated"
label = "gated"
[arms.options]
presentation = "deceptive_grounding_doc_injection"
checks = ["quote_verbatim", "entity_in_window", "qualifiers_in_window", "no_closer_competitor", "premise_present"]
[arms.options.parameters]          # PROPOSED - requires owner approval before freeze
window_tokens = 40                 # tokens between quote and mention, at most
min_quote_tokens = 5               # same as the provenance scorer (section 6.3)
lead_max_tokens = 4                # longest lead term considered a document subject
lead_min_repeats = 2               # a lead term must recur in its document
premise_scope = "document"         # key terms looked up in the whole cited document
competitor_tie = "fail"            # equal distance of entity and competitor blocks
[arms.options.decomposer]
name = "model_decomposer"          # PR 3; slot "Dec" of PREREGISTRATION.md section 9 (provisional)
[arms.options.decomposer.options]
prompt_version = 1
[arms.options.decomposer.options.model]
name = "openai_responses"
label = "decomposer"
[arms.options.decomposer.options.model.options]
model_id = "gpt-6-luna"
max_output_tokens = 4096
reasoning = { effort = "none" }    # lowest setting, as for slot A (section 9)
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[scorers]]
name = "provenance"
[scorers.options]
min_quote_tokens = 5
