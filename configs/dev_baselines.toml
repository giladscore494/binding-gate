# PR 5 comparison baselines (PREREGISTRATION.md section 5; configs/budget.toml, run
# "dev_baselines"), dev split, 1 repeat, the three primary models (A, E, H), on a pre-registered stratified
# dev subsample: 20 items per condition (300 items; binding_gate.sampling, seed 20261122).
#
# Arms, all in ONE run:
#   no_gate               the reference; seeded from the dev baseline (free) and shared with
#                         faithfulness_checker ("same candidate, different gate")
#   prompt_entity_check   a different prompt (no_gate + a fixed entity-check instruction), hence
#                         its own, PAID model call - the reason for the subsample on dev (on the
#                         test split it runs on every item: configs/test_layer1.toml)
#   faithfulness_checker  the no_gate candidate accepted or blocked by MiniCheck
#                         (MiniCheck-Flan-T5-Large, pinned; section 5), locally on CPU, free
# The LLM-judge arm llm_judge_checks runs in configs/dev_llm_judge_checks.toml (smaller judge
# subsample; the judge is the most expensive model of the study).
#
# Models, dataset, sampling and retries are those of configs/dev_baseline.toml (section 9). The
# section 10 stop rule decides which models continue; models that stop must be removed here
# before a paid run. Nothing in this file is read from environment variables; only API keys are
# (src/binding_gate/secrets.py).

config_version = 1
name = "dev-baselines"
description = "PR 5/13 comparison baselines on a 300-item dev subsample: no_gate (seeded), prompt_entity_check, faithfulness_checker; 1 repeat, primary models."
split = "dev"
repeats = 1

[sample]                                 # PROPOSED (section 9): 20 items per condition
per_stratum = 20
seed = 20261122

[runner]
# Hard budget cap in US dollars PER MODEL LABEL (reported usage x configs/prices.toml; auxiliary
# calls such as the decomposer and the judge included). Each cap is this run's allotment in
# configs/budget.toml, just above its HIGH estimate; sum of caps 1.1 USD. PROPOSED.
concurrency = 8
prices = "configs/prices.toml"
seed_responses_from = ["seeds/*"]      # PR 13: every run of the workflow run given in seed_run_id
max_usd = 0.2
[runner.max_usd_by_model]
google-low = 0.45
zai-low = 0.45

[dataset]
name = "deceptive_grounding"
[dataset.options]
root = "data/raw/deceptive-grounding-benchmark"
repository = "https://github.com/CedricCaruzzo/deceptive-grounding-benchmark"
commit = "61b0281d8d3897f53bef3f7402727c905614c1e4"
data_sha256 = "1feb80b85717ada1b48114b2dc1922ad5cfa694f4444888669ebc716f8653123"

[[models]]                               # slot A
name = "openai_responses"
label = "openai-low"
[models.options]
model_id = "gpt-6-luna"
max_output_tokens = 4096
# temperature: not sent (provider default); see the header
reasoning = { effort = "none" }         # lowest setting (section 9); UNVERIFIED for this id, see the header
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot E
name = "google_gemini"
label = "google-low"
[models.options]
model_id = "gemini-3.1-flash-lite"
max_output_tokens = 4096
temperature = 0.0
thinking_config = { thinkingLevel = "minimal" }   # lowest setting (section 9); UNVERIFIED for this id
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot H
name = "zai_chat"
label = "zai-low"
[models.options]
model_id = "glm-5.3-flash"
max_output_tokens = 4096
temperature = 0.0                        # documented range [0.0, 1.0] (docs.z.ai); UNVERIFIED live, see the header
thinking = { type = "enabled" }          # GLM-5.3 models cannot disable thinking (docs.z.ai, read 2026-11-22)
reasoning_effort = "low"                 # lowest setting for GLM-5.3 / GLM-5.3-Flash (section 9; docs.z.ai)
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[arms]]
name = "no_gate"
label = "no_gate"
[arms.options]
presentation = "deceptive_grounding_doc_injection"

[[arms]]
name = "prompt_entity_check"
label = "prompt_entity_check"
[arms.options]
presentation = "deceptive_grounding_doc_injection"

[[arms]]
name = "faithfulness_checker"            # MiniCheck-Flan-T5-Large, pinned (section 5); needs the
label = "faithfulness_checker"           # faithfulness extra and `faithfulness_checker prepare`
[arms.options]
presentation = "deceptive_grounding_doc_injection"
backend = "minicheck"
evidence = "all_documents"

[[scorers]]
name = "provenance"
[scorers.options]
min_quote_tokens = 5
