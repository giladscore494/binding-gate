# PR 2 / PR 13 dev baseline (PREREGISTRATION.md section 10; configs/budget.toml, run
# "dev_baseline"): arm no_gate, the four PRIMARY low-cost models (slots A, C, E, G), ONE repeat,
# deterministic provenance scoring, dev split only.
# 45 dev (X, C) pairs = 97 triples x 15 conditions = 1,455 items -> 1,455 calls per model.
# Run configs/dev_smoke.toml first. This run's answers are the seeds of every later dev run
# (`seed_responses_from = ["seeds/*"]`), so they are paid once.
#
# Models: PREREGISTRATION.md section 9, slots A, C, E, G. The mid-tier models (B, D, F) are not
# run on dev: they are an exploratory capability check on a test subsample only
# (configs/test_layer1_midtier.toml).
# Sampling, identical for every model and recorded in every trace record (PREREGISTRATION.md
# section 9, PR 13 "lowest reasoning setting, identical policy for all models"):
#   - reasoning / thinking at the LOWEST available setting: OpenAI `reasoning = {effort = "none"}`
#     (Responses API; the parameter name and the value "none" are UNVERIFIED for these ids:
#     if the smoke run answers HTTP 400, use "minimal", then "low", in every config, and record
#     it in section 9); Gemini `thinkingConfig = {thinkingLevel = "minimal"}` (UNVERIFIED for
#     these ids; fallback "low"); Claude without extended thinking (no `thinking` field: the
#     Messages API thinks only when it is enabled); DeepSeek non-thinking mode
#     (`thinking = {type = "disabled"}`, documented at api-docs.deepseek.com, read 2026-11-22).
#   - temperature: 0.0 where the API is expected to accept it (Anthropic, Google, DeepSeek);
#     none is sent to OpenAI. UNVERIFIED until the smoke run; a provider that rejects it gets
#     the provider default, recorded in section 9.
#   - max_output_tokens = 4096 so that truncation does not create unparseable outputs.
# Retries: up to 5 per call on HTTP 408/429/5xx and transport errors, exponential backoff from
# 2 s capped at 60 s; every attempt is logged in the trace.
#
# The dataset is the Deceptive Grounding benchmark cloned at the pinned commit into data/raw/
# (git-ignored). Only the dev split is used. Nothing in this file is read from environment variables; only API keys are
# (src/binding_gate/secrets.py).

config_version = 1
name = "dev-baseline"
description = "PR 13 baseline wrong-entity rate: no_gate on the dev split, 1 repeat, the four primary low-cost models."
split = "dev"
repeats = 1

[runner]
# Hard budget cap in US dollars PER MODEL LABEL (reported usage x configs/prices.toml; auxiliary
# calls such as the decomposer and the judge included). Each cap is this run's allotment in
# configs/budget.toml, just above its HIGH estimate; sum of caps 5.45 USD. PROPOSED.
concurrency = 8
prices = "configs/prices.toml"
max_usd = 0.75
[runner.max_usd_by_model]
google-low = 2.1
deepseek-low = 1.85

[dataset]
name = "deceptive_grounding"
[dataset.options]
root = "data/raw/deceptive-grounding-benchmark"
repository = "https://github.com/CedricCaruzzo/deceptive-grounding-benchmark"
commit = "61b0281d8d3897f53bef3f7402727c905614c1e4"
data_sha256 = "1feb80b85717ada1b48114b2dc1922ad5cfa694f4444888669ebc716f8653123"

[[models]]                               # slot A
name = "openai_responses"
label = "openai-low"
[models.options]
model_id = "gpt-6-luna"
max_output_tokens = 4096
# temperature: not sent (provider default); see the header
reasoning = { effort = "none" }         # lowest setting (section 9); UNVERIFIED for this id, see the header
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot C
name = "anthropic_messages"
label = "anthropic-low"
[models.options]
model_id = "claude-haiku-5-5"
max_output_tokens = 4096
temperature = 0.0
# thinking: not sent = no extended thinking (the lowest setting; section 9)
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot E
name = "google_gemini"
label = "google-low"
[models.options]
model_id = "gemini-3.1-flash-lite"
max_output_tokens = 4096
temperature = 0.0
thinking_config = { thinkingLevel = "minimal" }   # lowest setting (section 9); UNVERIFIED for this id
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[models]]                               # slot G
name = "deepseek_chat"
label = "deepseek-low"
[models.options]
model_id = "deepseek-flash"
max_output_tokens = 4096
temperature = 0.0                        # UNVERIFIED on DeepSeek's API; see the header
thinking = { type = "disabled" }        # non-thinking mode (section 9); documented by DeepSeek, read 2026-11-22
timeout_seconds = 180
max_retries = 5
backoff_seconds = 2.0
max_backoff_seconds = 60.0

[[arms]]
name = "no_gate"
label = "no_gate"
[arms.options]
presentation = "deceptive_grounding_doc_injection"

[[scorers]]
name = "provenance"
[scorers.options]
min_quote_tokens = 5
