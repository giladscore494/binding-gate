# painscan query plan (fixed BEFORE any search, 2026-11-23). See tools/painscan/PREREGISTRATION.md.
# Every query is generated deterministically from this file; the plan hash is recorded in every run.
plan_version = 1

# Forums where non-developer agent/automation users post (one OR-ed site: group).
forum_sites = ["community.shopify.com", "community.n8n.io", "community.zapier.com", "quickbooks.intuit.com", "forum.cursor.com", "community.openai.com", "community.make.com"]

[serper]
gl = "us"
hl = "en"
num = 10                     # 10 results = 1 credit per query
recent_tbs = "qdr:m3"        # "recent" window: last 3 months (smoke run checks that Serper honours it)
recent_tbs_fallback = "qdr:m" # used if the smoke run shows qdr:m3 is ignored
baseline_tbs = "qdr:y"       # comparison window: last 12 months
max_queries_hard = 1300      # hard cap per invocation, whatever the workflow input says
workers = 4


# Query templates. {p} = the domain phrase. "window" = recent+baseline (both), recent, baseline, none.
[[template]]
kind = "pain"
source = "reddit"
window = "both"
texts = ["{p} mistakes", "{p} wrong", "{p} hallucinated", "{p} cost us", "{p} frustrated", "{p} had to double check"]

[[template]]
kind = "pain"
source = "web"
window = "both"
texts = ["{p} errors complaints", "{p} went wrong", "{p} problems"]

[[template]]
kind = "pain"
source = "forums"
window = "both"
texts = ["{p} wrong"]

[[template]]
kind = "pain"
source = "hn"
window = "both"
texts = ["{p} problems"]

[[template]]
kind = "demand"
source = "reddit"
window = "baseline"
texts = ["is there a tool to check {p}"]

[[template]]
kind = "demand"
source = "web"
window = "baseline"
texts = ["tool to verify {p} output", "{p} quality control"]

[[template]]
kind = "competition"
source = "web"
window = "none"
texts = ["{p} software", "best {p} tool 2026"]

# Domains. Feasibility attributes are fixed here, before any data, with a one-line reason:
#   regulated        heavy regulation / liability / sensitive data (medical, legal, tax, insurance, hiring law)
#   smb_reachable    buyers are small businesses or prosumers a solo founder can reach online
#   source_of_truth  an external reference exists, so a wrong output can be caught by a deterministic check
#   bigtech_building a platform owner ships this check itself (Microsoft, Google, OpenAI, Salesforce, Intuit, Shopify)
#   israel_edge      Hebrew / Israeli-market knowledge is an advantage
[[domain]]
id = "coding"
phrase = "AI coding agent"
regulated = false
smb_reachable = true
source_of_truth = true
bigtech_building = true
israel_edge = false
reason = "tests/CI are a reference; Anthropic/OpenAI/Cursor and funded reviewers already compete"

